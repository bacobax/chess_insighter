sampling:
  min_samples: 3

complexity:
  simple_percentile: 50
  complex_percentile: 85
  high_percentile: 90

opening:
  post_opening_move_count: 6
  weights:
    book_accuracy: 0.15
    eval_stability_after_opening: 0.5
    result_from_opening_positions: 0.35

time_management:
  time_pressure_seconds: 30.0
  blunder_win_prob_loss: 0.10
  critical_underthinking_seconds: 5.0
  simple_overthinking_seconds: 30.0
  opponent_error_win_prob_loss: 0.05
  weights:
    time_trouble: 0.35
    blunders_in_time_pressure: 0.35
    bad_time_allocation: 0.30

game_analysis:
  weakness_loss_threshold: 0.08
  improvement_delta: 0.02

skill_score_calibration:
  tactics_wp_loss_half_life: 0.07
  calculation_wp_loss_half_life: 0.06
  quiet_middlegame_wp_loss_half_life: 0.045
  endgame_wp_loss_half_life: 0.05

advantage_capitalization:
  winning_eval_cp: 200
  clearly_winning_eval_cp: 500
  weights:
    conversion_rate_from_winning_positions: 0.5
    eval_preservation_when_ahead: 0.3
    low_blunder_rate_when_ahead: 0.2

resourcefulness:
  worse_eval_cp: -200
  lost_eval_cp: -500
  weights:
    save_rate_from_bad_positions: 0.4
    eval_recovery_after_disadvantage: 0.3
    low_collapse_rate_when_worse: 0.3

result_scores:
  win: 1.0
  draw: 0.5
  loss: 0.0

player_profile:
  complexity_scale_percentile: 95
  loss_normalization:
    win_probability_loss: 0.08
    centipawn_loss: 300
    tactical_cp_loss: 80
    calculation_cp_loss: 90
    quiet_cp_loss: 35
    complex_cp_loss: 100
    endgame_cp_loss: 60
  king_safety_performance_threshold: 0.65
  material_imbalance_threshold: 0.05
  tactics:
    test_cp_gain_threshold: 120
    test_forcing_depth_threshold: 2
    weights:
      tactical_accuracy: 0.40
      missed_tactic_avoidance: 0.30
      top_n_match_rate: 0.20
      difficulty_adjustment: 0.10
  calculation:
    cp_gain_threshold: 150
    forcing_depth_threshold: 2
    weights:
      top_1_match_rate: 0.35
      top_3_match_rate: 0.25
      loss_performance: 0.25
      forcing_sequence_preservation: 0.15
  middlegame_strategy:
    weights:
      quiet_position_performance: 0.25
      pawn_structure_comfort: 0.20
      king_safety_performance: 0.20
      advantage_capitalization: 0.20
      absolute_complexity_control: 0.15
  advantage:
    win_probability_move_threshold: 0.65
    win_probability_game_threshold: 0.70
    blunder_win_probability_loss: 0.20
    centipawn_threshold: 200
    weights:
      accuracy_while_better: 0.45
      conversion_rate: 0.35
      low_blunder_rate: 0.20
  resourcefulness:
    win_probability_move_threshold: 0.35
    win_probability_game_threshold: 0.30
    recovery_delta: 0.05
    centipawn_threshold: -200
    weights:
      defensive_accuracy: 0.40
      recovery_rate: 0.30
      save_rate: 0.30
  endgame:
    winning_win_probability_threshold: 0.65
    worse_win_probability_threshold: 0.35
    equal_win_probability_low: 0.45
    equal_win_probability_high: 0.55
    weights:
      endgame_accuracy: 0.45
      conversion_rate: 0.25
      save_rate: 0.20
      equal_endgame_hold_rate: 0.10
  diversity:
    entropy_weight: 0.70
    top_share_weight: 0.30
  pawn_structure:
    weights:
      isolated_pawn_exposure: 0.20
      doubled_pawn_exposure: 0.15
      backward_pawn_exposure: 0.15
      passed_pawn_exposure: 0.20
      semi_open_file_exposure: 0.15
      open_center_exposure: 0.15
