[project]
name = "chess-insighter"
version = "0.1.0"
description = "Local full-stack chess analysis: Chess.com reports, mistakes analysis, and opening study."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "python-chess>=1.999",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "argon2-cffi>=25.1.0",
    "PyJWT>=2.10.0",
    "resend[async]>=2.19.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient
]
# Position style encoder training pipeline (train_encoder.py, run_sweep.py)
ml = [
    "torch>=2.2",
    "pyyaml>=6.0",
    "zstandard>=0.22",
    "tqdm>=4.66",
]
# Exploratory marimo notebook (features_comparison.py)
notebooks = [
    "marimo>=0.9",
    "altair>=5.0",
    "scikit-learn>=1.4",
]

[tool.uv]
# Application, not a library: only manage the environment, don't build/install the project.
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
